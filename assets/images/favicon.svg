<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="64" height="64">
  <defs>
    <linearGradient id="gold-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#f59e0b" />
      <stop offset="50%" stop-color="#c27803" />
      <stop offset="100%" stop-color="#78350f" />
    </linearGradient>
    <linearGradient id="core-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0284c7" />
      <stop offset="100%" stop-color="#0369a1" />
    </linearGradient>
  </defs>
  <!-- Rounded Base Shield -->
  <rect x="2" y="2" width="60" height="60" rx="16" fill="#1c1917" stroke="#c27803" stroke-width="2" />
  
  <!-- Outer Interlocking Tri-Ring Nexus (Sense-Plan-Act) -->
  <circle cx="32" cy="22" r="13" fill="none" stroke="url(#gold-grad)" stroke-width="2.5" opacity="0.85" />
  <circle cx="23" cy="38" r="13" fill="none" stroke="url(#gold-grad)" stroke-width="2.5" opacity="0.85" />
  <circle cx="41" cy="38" r="13" fill="none" stroke="url(#gold-grad)" stroke-width="2.5" opacity="0.85" />

  <!-- Digital Traces -->
  <line x1="32" y1="9" x2="32" y2="4" stroke="#c27803" stroke-width="2" stroke-linecap="round" />
  <line x1="10" y1="46" x2="6" y2="50" stroke="#c27803" stroke-width="2" stroke-linecap="round" />
  <line x1="54" y1="46" x2="58" y2="50" stroke="#c27803" stroke-width="2" stroke-linecap="round" />

  <!-- Hexagonal Optical Perception Core -->
  <polygon points="32,25 38,28.5 38,35.5 32,39 26,35.5 26,28.5" fill="url(#core-grad)" stroke="#fef3c7" stroke-width="1.5" />
  <circle cx="32" cy="32" r="3" fill="#ffffff" />
</svg>
